# BUCA SLUG - Apache: nessuna informazione sulla versione, nessun elenco di cartelle, solo i file .php di /api.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
ServerName bucaslug

<Directory /var/www/html>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
    # fuori da /api/ non c'e' nulla da servire
    <FilesMatch ".*">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/html/api>
    <FilesMatch "^(giocatore|punteggio|classifica)\.php$">
        Require all granted
    </FilesMatch>
</Directory>
<Directory /var/www/lib>
    Require all denied
</Directory>

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "no-referrer"
Header always unset X-Powered-By
# la sonda di salute del container (da dentro) e le richieste vere: niente log di accesso dettagliati
LogLevel warn
