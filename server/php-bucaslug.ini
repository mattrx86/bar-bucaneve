; BUCA SLUG - PHP indurito: niente versione nelle risposte, niente errori a schermo, niente funzioni pericolose.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
allow_url_fopen = Off
allow_url_include = Off
file_uploads = Off
post_max_size = 8K
max_input_vars = 50
max_execution_time = 10
memory_limit = 64M
session.auto_start = 0
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,curl_exec,curl_multi_exec,parse_ini_file,show_source
open_basedir = /var/www/html:/var/www/lib:/tmp
