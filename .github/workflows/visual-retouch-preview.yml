name: Visual retouch preview
on:
  push:
    branches:
      - art-cohesion/preview-lab
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main source
        uses: actions/checkout@v4
        with:
          ref: art-cohesion/preview-lab
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install --upgrade pillow numpy scipy
      - name: Generate non-destructive visual comparisons
        run: python tools/visual_lab.py
      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: buca-slug-visual-preview
          path: visual-preview/
          if-no-files-found: error
