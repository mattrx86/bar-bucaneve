<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<!-- iPhone/iPad: "Condividi -> Aggiungi alla schermata Home" apre il gioco a tutto schermo, senza barre -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BUCA SLUG" />
<meta name="theme-color" content="#0a0a10" />
<title>BUCA SLUG</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a10; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #game { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: auto; }
  /* telefono in verticale: il gioco e' orizzontale, si invita a girarlo */
  #gira { display: none; position: fixed; left: 0; right: 0; bottom: 6vh; text-align: center; z-index: 30; pointer-events: none;
    font: bold 18px 'Courier New', monospace; color: #ffe066; text-shadow: 2px 2px 0 #000; }
  @media (orientation: portrait) and (pointer: coarse) { #gira { display: block; } }
</style>
</head>
<body><div id="game"></div><div id="gira">&#8635; GIRA IL TELEFONO IN ORIZZONTALE</div><script type="module" src="/src/main.ts"></script></body>
</html>
